services:
  bot:
    build: .
    container_name: race-reminder-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/raceday.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3, os; p=os.environ.get('DATABASE_PATH', '/app/data/raceday.db'); sqlite3.connect(p).execute('select 1').fetchone()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
